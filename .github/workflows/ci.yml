name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python reference/reference_algorithms.py
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: python reference/test_fixtures.py
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
